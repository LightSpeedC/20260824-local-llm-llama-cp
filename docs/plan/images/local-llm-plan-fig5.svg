<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" aria-label="モデル別の生成速度実測値">
	<rect width="100%" height="100%" fill="#ffffff"/>
	<defs>
		<linearGradient id="g-plan-fig5-a" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,65%)"/>
		</linearGradient>
		<linearGradient id="g-plan-fig5-b" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(240,78%,25%)"/><stop offset="1" stop-color="hsl(240,58%,65%)"/>
		</linearGradient>
		<linearGradient id="g-plan-fig5-c" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(180,78%,25%)"/><stop offset="1" stop-color="hsl(180,58%,65%)"/>
		</linearGradient>
		<linearGradient id="g-plan-fig5-d" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(120,78%,25%)"/><stop offset="1" stop-color="hsl(120,58%,65%)"/>
		</linearGradient>
		<linearGradient id="g-plan-fig5-e" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(50,78%,25%)"/><stop offset="1" stop-color="hsl(50,58%,65%)"/>
		</linearGradient>
		<linearGradient id="g-plan-fig5-f" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,65%)"/>
		</linearGradient>
	</defs>

	<text x="20" y="20" fill="#4a5568" font-size="13">横幅は tok/s に比例（最大 56.5）</text>

	<text x="20" y="46" fill="#1c2330" font-size="13">Qwen3-4B-Instruct  −ngl 99</text>
	<rect x="250" y="32" width="600" height="26" rx="5" fill="url(#g-plan-fig5-a)"/>
	<text x="840" y="50" fill="#fff" font-size="13" font-weight="700" text-anchor="end">56.49 tok/s</text>

	<text x="20" y="82" fill="#1c2330" font-size="13">gemma-3-4b-it  −ngl 99</text>
	<rect x="250" y="68" width="597" height="26" rx="5" fill="url(#g-plan-fig5-b)"/>
	<text x="837" y="86" fill="#fff" font-size="13" font-weight="700" text-anchor="end">56.25 tok/s</text>

	<text x="20" y="118" fill="#1c2330" font-size="13">gemma-4-E4B-it  −ngl 99</text>
	<rect x="250" y="104" width="480" height="26" rx="5" fill="url(#g-plan-fig5-c)"/>
	<text x="720" y="122" fill="#fff" font-size="13" font-weight="700" text-anchor="end">45.23 tok/s</text>

	<text x="20" y="154" fill="#1c2330" font-size="13">Qwen3.5-9B  −ngl 24 ＋KV量子化</text>
	<rect x="250" y="140" width="86" height="26" rx="5" fill="url(#g-plan-fig5-d)"/>
	<text x="346" y="158" fill="#1c2330" font-size="13" font-weight="700">8.12 tok/s</text>

	<text x="20" y="190" fill="#1c2330" font-size="13">gpt-oss-20b  −ncmoe 18</text>
	<rect x="250" y="176" width="63" height="26" rx="5" fill="url(#g-plan-fig5-e)"/>
	<text x="323" y="194" fill="#1c2330" font-size="13" font-weight="700">5.89 tok/s</text>

	<text x="20" y="226" fill="#1c2330" font-size="13">Qwen3.5-9B  −ngl 99（超過）</text>
	<rect x="250" y="212" width="16" height="26" rx="5" fill="url(#g-plan-fig5-f)"/>
	<text x="276" y="230" fill="#1c2330" font-size="13" font-weight="700">1.55 tok/s</text>

	<line x1="250" y1="252" x2="850" y2="252" stroke="#d9dfe8" stroke-width="1"/>
	<text x="250" y="272" fill="#4a5568" font-size="13">合格ライン 15 tok/s</text>
	<line x1="409" y1="26" x2="409" y2="246" stroke="#a51f22" stroke-width="1.5" stroke-dasharray="4 3"/>
	<text x="415" y="290" fill="#a51f22" font-size="12">← ここより左は対話に使える速度に届かない</text>
</svg>