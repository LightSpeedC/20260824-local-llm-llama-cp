<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" aria-label="密モデルとMoEモデルの実行イメージの比較">
	<rect width="100%" height="100%" fill="#ffffff"/>
	<defs>
		<linearGradient id="g-plan-fig4-a" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(210,78%,25%)"/>
			<stop offset="1" stop-color="hsl(210,58%,65%)"/>
		</linearGradient>
		<linearGradient id="g-plan-fig4-b" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
		<linearGradient id="g-plan-fig4-c" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(35,78%,25%)"/>
			<stop offset="1" stop-color="hsl(35,58%,65%)"/>
		</linearGradient>
	</defs>

	<text x="20" y="24" fill="#1c2330" font-size="15" font-weight="700">密モデル（例: 9B）— 毎トークン、全パラメータを計算する</text>
	<rect x="20" y="36" width="410" height="60" rx="8" fill="url(#g-plan-fig4-a)"/>
	<text x="225" y="62" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">9B すべてを計算</text>
	<text x="225" y="84" fill="#fff" font-size="13" text-anchor="middle">メモリ 5.2 GB ／ 計算量 9B 相当</text>
	<text x="445" y="70" fill="#4a5568" font-size="13">メモリも計算量も同じ大きさ</text>

	<text x="20" y="134" fill="#1c2330" font-size="15" font-weight="700">MoEモデル（例: 30B-A3B）— 全部を持つが、毎トークン使うのは一部の expert だけ</text>
	<rect x="20" y="146" width="620" height="34" rx="8" fill="url(#g-plan-fig4-c)"/>
	<text x="330" y="169" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">メモリには 30B 分を置く必要がある（約 12 GB）← RAM 16GB が上限を決める</text>
	<rect x="20" y="190" width="62" height="34" rx="8" fill="url(#g-plan-fig4-b)"/>
	<text x="51" y="213" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">3B</text>
	<text x="95" y="213" fill="#1c2330" font-size="13">実際に計算するのはこれだけ ＝ 4Bクラスの速度で 30B の知識を引ける</text>
	<text x="20" y="248" fill="#4a5568" font-size="13">llama.cpp の <tspan font-family="Consolas,monospace">--n-cpu-moe</tspan> で「expert 層だけCPU、attention 等はGPU」に分けられる ← 4GB VRAM でも分担が成立する</text>
</svg>