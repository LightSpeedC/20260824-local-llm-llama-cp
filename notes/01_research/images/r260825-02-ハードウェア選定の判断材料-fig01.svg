<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="現環境とZGXのメモリ容量・帯域の比較">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="20" y="24" fill="#1c2330" font-size="15" font-weight="700">メモリ容量 — 32倍になる</text>
	<text x="20" y="52" fill="#1c2330" font-size="13">現環境 4GB</text>
	<rect x="180" y="36" width="21" height="24" rx="4" fill="url(#i1)"/>
	<text x="212" y="53" fill="#4a5568" font-size="13">4 GB</text>
	<text x="20" y="88" fill="#1c2330" font-size="13">ZGX 128GB</text>
	<rect x="180" y="72" width="672" height="24" rx="4" fill="url(#i2)"/>
	<text x="516" y="89" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">128 GB（統合メモリ）</text>

	<text x="20" y="140" fill="#1c2330" font-size="15" font-weight="700">メモリ帯域 — 1.4倍にしかならない</text>
	<text x="20" y="168" fill="#1c2330" font-size="13">現環境</text>
	<rect x="180" y="152" width="473" height="24" rx="4" fill="url(#i1)"/>
	<text x="416" y="169" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">約 192 GB/s</text>
	<text x="20" y="204" fill="#1c2330" font-size="13">ZGX</text>
	<rect x="180" y="188" width="672" height="24" rx="4" fill="url(#i2)"/>
	<text x="516" y="205" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">約 273 GB/s（公称値からの概算）</text>

	<text x="20" y="244" fill="#a51f22" font-size="14" font-weight="700">→ 同じサイズのモデルなら、速度は1.4倍程度にしかならない。効くのは「載る量」の方</text>
</svg>
