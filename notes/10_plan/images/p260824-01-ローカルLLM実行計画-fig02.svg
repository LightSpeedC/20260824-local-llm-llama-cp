<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="モデルサイズ帯の比較図">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(280,78%,25%)"/>
			<stop offset="1" stop-color="hsl(280,58%,55%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,55%)"/>
		</linearGradient>
		<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/>
			<stop offset="1" stop-color="hsl(0,58%,55%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="20" y="40" width="270" height="180" rx="10" fill="url(#i1)"/>
	<text x="155" y="80" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">3〜4B クラス</text>
	<text x="155" y="112" fill="#fff" font-size="15" text-anchor="middle">重み 約 2.0〜2.6 GB</text>
	<text x="155" y="138" fill="#fff" font-size="15" text-anchor="middle">全層がVRAMに載る</text>
	<text x="155" y="164" fill="#fff" font-size="15" text-anchor="middle">25〜40 tok/s</text>
	<text x="155" y="196" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">◎ 日常使いの本命</text>

	<rect x="315" y="40" width="270" height="180" rx="10" fill="url(#i2)"/>
	<text x="450" y="80" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">7〜8B クラス</text>
	<text x="450" y="112" fill="#fff" font-size="15" text-anchor="middle">重み 約 4.5〜5.0 GB</text>
	<text x="450" y="138" fill="#fff" font-size="15" text-anchor="middle">6〜7割をGPUに載せる</text>
	<text x="450" y="164" fill="#fff" font-size="15" text-anchor="middle">6〜10 tok/s</text>
	<text x="450" y="196" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">○ 品質重視の予備</text>

	<rect x="610" y="40" width="270" height="180" rx="10" fill="url(#i3)"/>
	<text x="745" y="80" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">12〜14B クラス</text>
	<text x="745" y="112" fill="#fff" font-size="15" text-anchor="middle">重み 約 7.3〜9.0 GB</text>
	<text x="745" y="138" fill="#fff" font-size="15" text-anchor="middle">大半がCPU側に残る</text>
	<text x="745" y="164" fill="#fff" font-size="15" text-anchor="middle">2〜3 tok/s</text>
	<text x="745" y="196" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">△ 対話には遅すぎる</text>

	<text x="450" y="24" fill="#1c2330" font-size="15" text-anchor="middle">VRAM 4GB・Q4_K_M 量子化を前提とした比較</text>
</svg>
